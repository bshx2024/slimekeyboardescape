<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Play Slime Keyboard Escape 3D Online Free - Fullscreen HTML5 Game</title>
    <meta name="description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Run over giant 3D rainbow keyboard keys, dodge traps, and level up speed 100% free unblocked.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Play Slime Keyboard Escape 3D Online Free">
    <meta property="og:description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Run over giant 3D rainbow keyboard keys, dodge traps, and level up speed.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Three.js 3D WebGL Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Styles -->
    <style>
        :root {
            --bg-dark: #070a12;
            --primary: #10b981;
            --primary-glow: #34d399;
            --accent-lime: #a3e635;
            --text-main: #f3f4f6;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-main);
        }

        .player-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000000;
        }

        .player-header {
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(16, 185, 129, 0.35);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        .btn-back, .btn-fs {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--primary-glow);
            color: var(--primary-glow);
            transform: translateX(-3px);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-fs:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .player-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .live-indicator {
            width: 9px;
            height: 9px;
            background-color: var(--primary-glow);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary-glow);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .player-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
            background: #070a12;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 3D HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 100;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(16, 185, 129, 0.4);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 1.1rem;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);

            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .hud-card span.value {
            color: var(--primary-glow);
        }

        /* Game Over Modal */
        .gameover-modal {
            position: absolute;
            inset: 0;
            background: rgba(7, 10, 18, 0.88);
            backdrop-filter: blur(12px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .gameover-card {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #ef4444;
            padding: 2.5rem 3rem;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.4);
            max-width: 440px;
        }

        .gameover-title {
            font-family: var(--font-head);
            font-size: 2.2rem;
            font-weight: 900;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }

        .gameover-score {
            font-size: 1.2rem;
            color: #f3f4f6;
            margin-bottom: 1.5rem;
        }

        .btn-restart-game {
            padding: 0.85rem 2.2rem;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--primary-glow), var(--primary));
            color: #090d16;
            font-family: var(--font-head);
            font-size: 1.1rem;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.6);
            transition: all 0.2s ease;
        }

        .btn-restart-game:hover {
            transform: scale(1.06);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.9);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Top Navigation Header -->
        <header class="player-header">
            <a href="index.html" class="btn-back" id="btn-return-main">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Return to Main Site</span>
            </a>

            <div class="player-title">
                <span class="live-indicator"></span>
                <span>Slime Keyboard Escape 3D (WebGL)</span>
            </div>

            <button type="button" class="btn-fs" id="btn-fullscreen-toggle">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span>Fullscreen</span>
            </button>
        </header>

        <!-- Main Game Body Area -->
        <main class="player-body" id="player-body">
            <div class="hud-overlay">
                <div class="hud-card">
                    <span>⚡ SPEED:</span>
                    <span class="value" id="hud-speed">+1</span>
                </div>
                <div class="hud-card">
                    <span>🏆 SCORE:</span>
                    <span class="value" id="hud-score">0</span>
                </div>
            </div>

            <div class="gameover-modal" id="gameover-modal">
                <div class="gameover-card">
                    <div class="gameover-title">CRASHED!</div>
                    <div class="gameover-score" id="gameover-score-text">Final Score: 0 Points</div>
                    <button type="button" class="btn-restart-game" id="btn-restart-3d">PLAY AGAIN</button>
                </div>
            </div>

            <canvas id="webgl-canvas"></canvas>
        </main>
    </div>

    <!-- Three.js 3D Engine Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('player-body');
            const canvas = document.getElementById('webgl-canvas');
            const hudSpeed = document.getElementById('hud-speed');
            const hudScore = document.getElementById('hud-score');
            const gameOverModal = document.getElementById('gameover-modal');
            const btnRestart = document.getElementById('btn-restart-3d');
            const btnFs = document.getElementById('btn-fullscreen-toggle');

            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });

            // Web Audio Synthesizer
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;
            function playSound(freq, duration, type = 'sine') {
                try {
                    if (!audioCtx) audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e){}
            }

            // Three.js Scene Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070a12);
            scene.fog = new THREE.FogExp2(0x070a12, 0.009);

            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
            camera.position.set(0, 7, 14);
            camera.lookAt(0, 2, -10);

            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x34d399, 1.2);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xa3e635, 1, 30);
            pointLight.position.set(0, 5, 0);
            scene.add(pointLight);

            // 3D Player Character (Roblox / Slime Hybrid Hero)
            const playerGroup = new THREE.Group();
            
            // Slime / Hero Body
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x34d399, emissive: 0x059669, shininess: 100 });
            const playerBodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            playerBodyMesh.position.y = 0.6;
            playerBodyMesh.castShadow = true;
            playerGroup.add(playerBodyMesh);

            // Eyes
            const eyeGeo = new THREE.BoxGeometry(0.25, 0.25, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.3, 0.8, -0.6);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.3, 0.8, -0.6);
            playerGroup.add(eyeL);
            playerGroup.add(eyeR);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);

            // Lanes: Lane 0 = -4, Lane 1 = 0, Lane 2 = 4
            const LANES = [-4.5, 0, 4.5];
            let currentLane = 1;
            let targetX = 0;
            let playerY = 0;
            let playerVy = 0;
            let isJumping = false;

            // Keycaps Track Management
            const keycaps = [];
            const KEY_NAMES = ['SPACE', 'ENTER', 'SHIFT', 'CTRL', 'W', 'A', 'S', 'D', 'ALT', 'TAB'];
            const RAINBOW_COLORS = [0xff007f, 0x00f0ff, 0x7000ff, 0x00ff66, 0xffbe00];

            function createKeycapMesh(label, isTrap, colorHex) {
                const group = new THREE.Group();
                
                // Keycap Base Box
                const keyGeo = new THREE.BoxGeometry(3.6, 1.2, 3.6);
                const keyMat = new THREE.MeshPhongMaterial({ 
                    color: isTrap ? 0xef4444 : colorHex,
                    emissive: isTrap ? 0x991b1b : 0x111827,
                    shininess: 80 
                });
                const keyMesh = new THREE.Mesh(keyGeo, keyMat);
                keyMesh.castShadow = true;
                keyMesh.receiveShadow = true;
                group.add(keyMesh);

                // Top Switch Cap
                const topGeo = new THREE.BoxGeometry(3.0, 0.3, 3.0);
                const topMat = new THREE.MeshPhongMaterial({ color: isTrap ? 0xf87171 : 0xffffff });
                const topMesh = new THREE.Mesh(topGeo, topMat);
                topMesh.position.y = 0.65;
                group.add(topMesh);

                group.userData = { isTrap: isTrap, pressed: false };
                return group;
            }

            // Initial Track Spawning
            for (let i = 0; i < 20; i++) {
                const laneIdx = Math.floor(Math.random() * 3);
                const isTrap = Math.random() < 0.28 && i > 3;
                const colorHex = RAINBOW_COLORS[i % RAINBOW_COLORS.length];
                const keyMesh = createKeycapMesh(KEY_NAMES[i % KEY_NAMES.length], isTrap, colorHex);
                
                keyMesh.position.set(LANES[laneIdx], 0, -i * 8);
                scene.add(keyMesh);
                keycaps.push(keyMesh);
            }

            // Particle System
            const particles = [];
            function spawnSparks(x, z) {
                for (let i = 0; i < 15; i++) {
                    const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.set(x, 1, z);
                    scene.add(pMesh);
                    particles.push({
                        mesh: pMesh,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: Math.random() * 0.4 + 0.2,
                        vz: (Math.random() - 0.5) * 0.4,
                        life: 1.0
                    });
                }
            }

            // Game Logic Variables
            let speedMultiplier = 1;
            let score = 0;
            let isGameOver = false;
            let runningDistance = 0;

            function restartGame() {
                isGameOver = false;
                currentLane = 1;
                targetX = 0;
                playerY = 0;
                playerVy = 0;
                isJumping = false;
                speedMultiplier = 1;
                score = 0;
                runningDistance = 0;

                hudSpeed.textContent = `+${speedMultiplier.toFixed(0)}`;
                hudScore.textContent = '0';
                gameOverModal.style.display = 'none';

                // Reset keycaps
                keycaps.forEach((k, idx) => {
                    const laneIdx = Math.floor(Math.random() * 3);
                    k.position.set(LANES[laneIdx], 0, -idx * 8);
                    k.userData.pressed = false;
                });
            }

            btnRestart.addEventListener('click', restartGame);

            // Controls
            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                    if (currentLane > 0) {
                        currentLane--;
                        playSound(300, 0.05);
                    }
                } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
                    if (currentLane < 2) {
                        currentLane++;
                        playSound(300, 0.05);
                    }
                } else if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.45;
                        playSound(420, 0.1);
                    }
                }
            });

            // Touch Controls
            let touchStartX = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            window.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                const touchEndX = e.changedTouches[0].clientX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 30) {
                    if (diff > 0 && currentLane < 2) currentLane++;
                    else if (diff < 0 && currentLane > 0) currentLane--;
                } else {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.45;
                    }
                }
            });

            // Animation Loop
            let clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();
                const time = clock.getElapsedTime();

                if (!isGameOver) {
                    runningDistance += speedMultiplier * 0.2;
                    score = Math.floor(runningDistance * 10);
                    speedMultiplier += 0.0008;

                    hudSpeed.textContent = `+${Math.floor(speedMultiplier)}`;
                    hudScore.textContent = score.toString();

                    // Smooth Lane Movement
                    targetX = LANES[currentLane];
                    playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;

                    // Jump Physics
                    if (isJumping) {
                        playerY += playerVy;
                        playerVy -= 0.025; // gravity
                        if (playerY <= 0) {
                            playerY = 0;
                            playerVy = 0;
                            isJumping = false;
                            playSound(180, 0.08, 'triangle');
                        }
                    }
                    playerGroup.position.y = playerY;

                    // Running Bounce & Wiggle
                    playerGroup.rotation.z = Math.sin(time * 12) * 0.08;
                    playerBodyMesh.scale.y = 1 + Math.sin(time * 15) * 0.08;

                    // Keycaps Scroll
                    keycaps.forEach(k => {
                        k.position.z += speedMultiplier * 0.25;

                        // Collision Check
                        if (k.position.z > -1.5 && k.position.z < 1.5 && Math.abs(k.position.x - playerGroup.position.x) < 1.8) {
                            if (k.userData.isTrap && playerY < 0.8) {
                                isGameOver = true;
                                playSound(100, 0.5, 'sawtooth');
                                document.getElementById('gameover-score-text').textContent = `Final Score: ${score} Points`;
                                gameOverModal.style.display = 'flex';
                            } else if (!k.userData.pressed) {
                                k.userData.pressed = true;
                                speedMultiplier += 0.2; // Gain +1 Speed
                                playSound(580, 0.1, 'sine');
                                spawnSparks(k.position.x, k.position.z);
                            }
                        }

                        // Recycling Keycaps behind camera
                        if (k.position.z > 12) {
                            k.position.z = -140;
                            k.position.x = LANES[Math.floor(Math.random() * 3)];
                            k.userData.pressed = false;
                        }
                    });

                    // Update Particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.mesh.position.x += p.vx;
                        p.mesh.position.y += p.vy;
                        p.mesh.position.z += p.vz;
                        p.life -= 0.05;
                        p.mesh.scale.setScalar(p.life);
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            particles.splice(i, 1);
                        }
                    }

                    // Move PointLight with player
                    pointLight.position.x = playerGroup.position.x;
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / (window.innerHeight - 60);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight - 60);
            });

            animate();
        });
    </script>
</body>
</html>
