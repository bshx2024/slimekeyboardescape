<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Play Slime Keyboard Escape 3D Online Free - Fullscreen HTML5 Game</title>
    <meta name="description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Dash over mechanical key switches, dodge traps, and set high scores 100% free unblocked.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Play Slime Keyboard Escape 3D Online Free">
    <meta property="og:description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Dash over mechanical key switches, dodge traps, and set high scores.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        :root {
            --bg-dark: #070a12;
            --primary: #10b981;
            --primary-glow: #34d399;
            --accent-lime: #a3e635;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-main);
        }

        /* Fullscreen Layout Wrapper */
        .player-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000000;
        }

        /* Glassmorphic Top Navigation Header */
        .player-header {
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(16, 185, 129, 0.35);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        .btn-back, .btn-fs {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--primary-glow);
            color: var(--primary-glow);
            transform: translateX(-3px);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-fs:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .player-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .live-indicator {
            width: 9px;
            height: 9px;
            background-color: var(--primary-glow);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary-glow);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        /* Main Game Body Frame */
        .player-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
            background: #070a12;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #070a12;
            cursor: pointer;
        }

        @media (max-width: 640px) {
            .player-header {
                padding: 0 0.75rem;
            }
            .player-title span:last-child {
                display: none;
            }
            .btn-back span, .btn-fs span {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Top Navigation Header -->
        <header class="player-header">
            <a href="index.html" class="btn-back" id="btn-return-main" title="Return to Slime Keyboard Escape Main Page">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Return to Main Site</span>
            </a>

            <div class="player-title">
                <span class="live-indicator"></span>
                <span>Slime Keyboard Escape 3D</span>
            </div>

            <button type="button" class="btn-fs" id="btn-fullscreen-toggle" title="Toggle Fullscreen Mode">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span>Fullscreen</span>
            </button>
        </header>

        <!-- Main Game Canvas Container -->
        <main class="player-body" id="player-body">
            <canvas id="game-canvas"></canvas>
        </main>
    </div>

    <!-- Script Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnFs = document.getElementById('btn-fullscreen-toggle');
            const playerBody = document.getElementById('player-body');
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');

            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (playerBody.requestFullscreen) playerBody.requestFullscreen();
                    else if (playerBody.webkitRequestFullscreen) playerBody.webkitRequestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });

            document.addEventListener('fullscreenchange', () => {
                const isFS = !!document.fullscreenElement;
                btnFs.querySelector('span').textContent = isFS ? 'Exit Fullscreen' : 'Fullscreen';
                setTimeout(resizeCanvas, 100);
            });

            // Audio Synth
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;
            function playSynthSound(freq, duration, type = 'sine') {
                try {
                    if (!audioCtx) audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e){}
            }

            // Game State
            const state = {
                lane: 1, // 0: Left, 1: Center, 2: Right
                targetX: 0,
                x: 0,
                y: 0,
                vy: 0,
                isJumping: false,
                squishX: 1,
                squishY: 1,
                speed: 9,
                distance: 0,
                score: 0,
                gameOver: false,
                keycaps: [],
                particles: []
            };

            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width || window.innerWidth;
                canvas.height = rect.height || (window.innerHeight - 60);
            }

            const KEYCAP_NAMES = ['SPACE', 'ENTER', 'ESC', 'SHIFT', 'CTRL', 'ALT', 'TAB', 'W', 'A', 'S', 'D', 'DEL'];

            function initGame() {
                resizeCanvas();
                state.lane = 1;
                state.x = 0;
                state.y = 0;
                state.vy = 0;
                state.isJumping = false;
                state.speed = 9;
                state.distance = 0;
                state.score = 0;
                state.gameOver = false;
                state.keycaps = [];
                state.particles = [];
                for(let i=0; i<7; i++) {
                    state.keycaps.push({
                        lane: Math.floor(Math.random() * 3),
                        z: 300 + i * 160,
                        label: KEYCAP_NAMES[i % KEYCAP_NAMES.length],
                        isTrap: i % 2 === 0,
                        pressed: false
                    });
                }
            }

            function update() {
                if (state.gameOver) return;

                state.distance += state.speed * 0.1;
                state.score = Math.floor(state.distance * 10);
                state.speed += 0.002;

                const laneWidth = canvas.width * 0.22;
                state.targetX = (state.lane - 1) * laneWidth;
                state.x += (state.targetX - state.x) * 0.25;

                if (state.isJumping) {
                    state.y += state.vy;
                    state.vy -= 1.1;
                    if (state.y <= 0) {
                        state.y = 0;
                        state.vy = 0;
                        state.isJumping = false;
                        state.squishX = 1.35;
                        state.squishY = 0.65;
                        playSynthSound(160, 0.08, 'triangle');
                    }
                }

                state.squishX += (1 - state.squishX) * 0.2;
                state.squishY += (1 - state.squishY) * 0.2;

                for (let i = 0; i < state.keycaps.length; i++) {
                    let k = state.keycaps[i];
                    k.z -= state.speed * 3.5;

                    if (k.z < 80 && k.z > -40 && k.lane === state.lane && state.y < 35) {
                        if (k.isTrap) {
                            state.gameOver = true;
                            playSynthSound(120, 0.4, 'sawtooth');
                        } else if (!k.pressed) {
                            k.pressed = true;
                            playSynthSound(440, 0.1, 'sine');
                            for (let p = 0; p < 12; p++) {
                                state.particles.push({
                                    x: state.x + (Math.random() - 0.5) * 40,
                                    y: state.y + Math.random() * 20,
                                    vx: (Math.random() - 0.5) * 8,
                                    vy: Math.random() * 8,
                                    life: 1
                                });
                            }
                        }
                    }

                    if (k.z < -200) {
                        k.z = 1000 + Math.random() * 200;
                        k.lane = Math.floor(Math.random() * 3);
                        k.label = KEYCAP_NAMES[Math.floor(Math.random() * KEYCAP_NAMES.length)];
                        k.isTrap = Math.random() < 0.38;
                        k.pressed = false;
                    }
                }

                state.particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.04;
                });
                state.particles = state.particles.filter(p => p.life > 0);
            }

            function draw() {
                const w = canvas.width;
                const h = canvas.height;

                ctx.fillStyle = '#070a12';
                ctx.fillRect(0, 0, w, h);

                const horizonY = h * 0.35;
                const vanishingX = w * 0.5;

                // Perspective Track Lines
                ctx.strokeStyle = 'rgba(52, 211, 153, 0.25)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(vanishingX - 50, horizonY);
                ctx.lineTo(w * 0.05, h);
                ctx.moveTo(vanishingX + 50, horizonY);
                ctx.lineTo(w * 0.95, h);
                ctx.stroke();

                // Lane Divider Glows
                [-0.5, 0.5].forEach(offset => {
                    ctx.strokeStyle = 'rgba(16, 185, 129, 0.15)';
                    ctx.beginPath();
                    ctx.moveTo(vanishingX + offset * 35, horizonY);
                    ctx.lineTo(vanishingX + offset * (w * 0.45), h);
                    ctx.stroke();
                });

                // Keycaps
                const sortedKeycaps = [...state.keycaps].sort((a, b) => b.z - a.z);

                sortedKeycaps.forEach(k => {
                    const scale = 350 / (350 + k.z);
                    if (scale <= 0) return;

                    const laneWidthAtZ = (w * 0.45) * scale;
                    const keyX = vanishingX + (k.lane - 1) * laneWidthAtZ;
                    const keyY = horizonY + (h * 0.55) * scale;
                    const keySize = 90 * scale;

                    ctx.save();
                    ctx.translate(keyX, keyY);

                    ctx.fillStyle = k.isTrap ? 'rgba(239, 68, 68, 0.85)' : (k.pressed ? 'rgba(16, 185, 129, 0.9)' : 'rgba(30, 41, 59, 0.9)');
                    ctx.strokeStyle = k.isTrap ? '#f87171' : '#34d399';
                    ctx.lineWidth = Math.max(1, 3 * scale);

                    ctx.beginPath();
                    ctx.roundRect(-keySize * 0.5, -keySize * 0.4, keySize, keySize * 0.8, 8 * scale);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = `700 ${Math.max(10, 16 * scale)}px Outfit, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(k.label, 0, 0);

                    ctx.restore();
                });

                // Slime Player
                const playerY = h * 0.82 - state.y;
                const playerX = vanishingX + state.x;
                const slimeR = 30;

                ctx.save();
                ctx.translate(playerX, playerY);

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(0, state.y * 0.6 + slimeR * 0.8, slimeR * 1.1 * state.squishX, slimeR * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Slime Glow
                ctx.shadowColor = '#34d399';
                ctx.shadowBlur = 20;

                // Slime Body
                ctx.fillStyle = 'rgba(52, 211, 153, 0.95)';
                ctx.beginPath();
                ctx.ellipse(0, 0, slimeR * state.squishX, slimeR * state.squishY, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                // Eyes
                ctx.fillStyle = '#090d16';
                ctx.beginPath();
                ctx.arc(-slimeR * 0.3, -slimeR * 0.1, slimeR * 0.22, 0, Math.PI * 2);
                ctx.arc(slimeR * 0.3, -slimeR * 0.1, slimeR * 0.22, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(-slimeR * 0.25, -slimeR * 0.15, slimeR * 0.08, 0, Math.PI * 2);
                ctx.arc(slimeR * 0.35, -slimeR * 0.15, slimeR * 0.08, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Particles
                state.particles.forEach(p => {
                    ctx.fillStyle = `rgba(52, 211, 153, ${p.life})`;
                    ctx.beginPath();
                    ctx.arc(vanishingX + p.x, h * 0.82 - p.y, 4 * p.life, 0, Math.PI * 2);
                    ctx.fill();
                });

                // HUD
                ctx.fillStyle = '#ffffff';
                ctx.font = '700 18px Outfit, sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText(`⚡ SPEED: ${Math.floor(state.speed * 15)} KM/H`, 20, 35);

                ctx.textAlign = 'right';
                ctx.fillText(`SCORE: ${state.score}`, w - 20, 35);

                if (state.gameOver) {
                    ctx.fillStyle = 'rgba(9, 13, 22, 0.88)';
                    ctx.fillRect(0, 0, w, h);

                    ctx.fillStyle = '#ef4444';
                    ctx.font = '800 34px Outfit, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('CRASHED ON KEY SWITCH!', w * 0.5, h * 0.4);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '600 20px Inter, sans-serif';
                    ctx.fillText(`Final Score: ${state.score} Points`, w * 0.5, h * 0.52);

                    ctx.fillStyle = '#10b981';
                    ctx.font = '700 18px Inter, sans-serif';
                    ctx.fillText('Press SPACEBAR / Arrow Keys to Play Again', w * 0.5, h * 0.65);
                }
            }

            let animId = null;
            function gameLoop() {
                update();
                draw();
                animId = requestAnimationFrame(gameLoop);
            }

            function handleJump() {
                if (!state.isJumping && !state.gameOver) {
                    state.isJumping = true;
                    state.vy = 18;
                    state.squishX = 0.7;
                    state.squishY = 1.3;
                    playSynthSound(320, 0.12, 'sine');
                } else if (state.gameOver) {
                    initGame();
                }
            }

            window.addEventListener('keydown', (e) => {
                if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    e.preventDefault();
                    handleJump();
                } else if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                    if (state.lane > 0) {
                        state.lane--;
                        playSynthSound(280, 0.05, 'sine');
                    }
                } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
                    if (state.lane < 2) {
                        state.lane++;
                        playSynthSound(280, 0.05, 'sine');
                    }
                }
            });

            canvas.addEventListener('click', handleJump);
            window.addEventListener('resize', resizeCanvas);

            initGame();
            gameLoop();
        });
    </script>
</body>
</html>
