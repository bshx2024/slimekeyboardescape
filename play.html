    <!-- Flamingo Roblox 1:1 High-Fidelity 3D WebGL Engine Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('player-body');
            const canvas = document.getElementById('webgl-canvas');
            const hudSpeed = document.getElementById('hud-speed');
            const hudScore = document.getElementById('hud-score');
            const comboBanner = document.getElementById('combo-banner');
            const codeModal = document.getElementById('code-modal');
            const btnOpenCode = document.getElementById('btn-open-code');
            const btnClaimCode = document.getElementById('btn-claim-code');
            const codeInput = document.getElementById('code-input');
            const gameOverModal = document.getElementById('gameover-modal');
            const btnRestart = document.getElementById('btn-restart-3d');
            const btnFs = document.getElementById('btn-fullscreen-toggle');
            const switchBtns = document.querySelectorAll('.switch-btn');

            let currentSwitchType = 'blue';

            switchBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSwitchType = btn.dataset.type;
                    playASMRSwitchSound();
                });
            });

            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });

            btnOpenCode.addEventListener('click', () => codeModal.style.display = 'flex');
            btnClaimCode.addEventListener('click', () => {
                const val = codeInput.value.trim().toUpperCase();
                if (val === 'BYP4SS1') {
                    speedMultiplier += 50;
                    playASMRSwitchSound(880, 0.4);
                    codeModal.style.display = 'none';
                    triggerComboSurgeBanner('🎁 CODE CLAIMED! +15,000 SPEED!');
                } else {
                    alert('Invalid Code! Try BYP4SS1');
                }
            });
            codeModal.addEventListener('click', (e) => { if (e.target === codeModal) codeModal.style.display = 'none'; });

            // Web Audio ASMR Switch Synthesizer
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;

            function playASMRSwitchSound(overrideFreq, duration = 0.08) {
                try {
                    if (!audioCtx) audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    let freq = overrideFreq;
                    let type = 'sine';

                    if (!overrideFreq) {
                        if (currentSwitchType === 'blue') {
                            freq = 750;
                            type = 'square';
                        } else if (currentSwitchType === 'red') {
                            freq = 320;
                            type = 'sine';
                        } else {
                            freq = 520;
                            type = 'triangle';
                        }
                    }

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e){}
            }

            // Real Keyboard Word Combo Detector
            let typedBuffer = '';
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                const char = e.key.toUpperCase();
                if (/^[A-Z]$/.test(char)) {
                    typedBuffer += char;
                    if (typedBuffer.length > 10) typedBuffer = typedBuffer.slice(-10);

                    if (typedBuffer.includes('SPEED') || typedBuffer.includes('ESCAPE')) {
                        typedBuffer = '';
                        speedMultiplier += 15;
                        triggerComboSurgeBanner('⚡ KEYBOARD COMBO SURGE! +5X SPEED!');
                        playASMRSwitchSound(900, 0.3);
                    }
                }
            });

            function triggerComboSurgeBanner(text) {
                comboBanner.textContent = text;
                comboBanner.classList.add('active');
                setTimeout(() => comboBanner.classList.remove('active'), 2500);
            }

            // Three.js 3D WebGL Engine Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070a14);
            scene.fog = new THREE.FogExp2(0x070a14, 0.005);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
            camera.position.set(0, 8, 15);
            camera.lookAt(0, 2, -12);

            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.3);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xa3e635, 1.6, 40);
            pointLight.position.set(0, 6, 0);
            scene.add(pointLight);

            // Roblox Blocky Character Model (Flamingo Style)
            const playerGroup = new THREE.Group();

            // Head (Yellow Block with Face)
            const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const headMat = new THREE.MeshPhongMaterial({ color: 0xfacc15 });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 2.4;
            headMesh.castShadow = true;
            playerGroup.add(headMesh);

            // Face Eyes
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.05);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.3, 2.5, -0.61);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.3, 2.5, -0.61);
            playerGroup.add(eyeL);
            playerGroup.add(eyeR);

            // Torso (Blue Shirt)
            const torsoGeo = new THREE.BoxGeometry(1.4, 1.4, 0.8);
            const torsoMat = new THREE.MeshPhongMaterial({ color: 0x0284c7 });
            const torsoMesh = new THREE.Mesh(torsoGeo, torsoMat);
            torsoMesh.position.y = 1.1;
            torsoMesh.castShadow = true;
            playerGroup.add(torsoMesh);

            // Arms
            const armGeo = new THREE.BoxGeometry(0.5, 1.3, 0.6);
            const armMat = new THREE.MeshPhongMaterial({ color: 0x0284c7 });
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-1.05, 1.1, 0);
            armL.castShadow = true;
            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(1.05, 1.1, 0);
            armR.castShadow = true;
            playerGroup.add(armL);
            playerGroup.add(armR);

            // Legs
            const legGeo = new THREE.BoxGeometry(0.65, 1.3, 0.65);
            const legMat = new THREE.MeshPhongMaterial({ color: 0x16a34a });
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.35, -0.2, 0);
            legL.castShadow = true;
            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.35, -0.2, 0);
            legR.castShadow = true;
            playerGroup.add(legL);
            playerGroup.add(legR);

            // 3D Rainbow Trail Ring Aura
            const auraGeo = new THREE.TorusGeometry(1.6, 0.1, 16, 32);
            const auraMat = new THREE.MeshBasicMaterial({ color: 0x34d399 });
            const auraMesh = new THREE.Mesh(auraGeo, auraMat);
            auraMesh.rotation.x = Math.PI / 2;
            auraMesh.position.y = 0.1;
            playerGroup.add(auraMesh);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);

            // Lanes: Lane 0 = -4.2, Lane 1 = 0, Lane 2 = 4.2
            const LANES = [-4.2, 0, 4.2];
            let currentLane = 1;
            let targetX = 0;
            let playerY = 0;
            let playerVy = 0;
            let isJumping = false;

            // Roblox Keyboard Track Creation (Pastel Colors as seen in Flamingo's Video)
            const keycaps = [];
            const KEY_LABELS = ['+1', 'SPEED', 'WIN', 'ALT', 'CTRL', 'SHIFT', 'W', 'A', 'S', 'D', 'SPACE', 'ENTER', '99', 'x2'];
            const ROBLOX_PASTEL_COLORS = [0xff75c3, 0x8ea5ff, 0xffd166, 0x06d6a0, 0xb8860b, 0xff9f1c];

            function createKeyCapLabelTexture(text, isTrap) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = isTrap ? '#ef4444' : '#1e293b';
                ctx.fillRect(0, 0, 256, 256);

                ctx.strokeStyle = isTrap ? '#f87171' : '#a3e635';
                ctx.lineWidth = 14;
                ctx.strokeRect(10, 10, 236, 236);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 64px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 128, 128);

                return new THREE.CanvasTexture(canvas);
            }

            function createKeycapMesh(label, isTrap, colorHex) {
                const group = new THREE.Group();

                // Beveled Switch Base
                const keyGeo = new THREE.BoxGeometry(3.6, 1.4, 3.6);
                const keyMat = new THREE.MeshPhongMaterial({
                    color: isTrap ? 0xb91c1c : colorHex,
                    shininess: 90
                });
                const keyMesh = new THREE.Mesh(keyGeo, keyMat);
                keyMesh.castShadow = true;
                keyMesh.receiveShadow = true;
                group.add(keyMesh);

                // Top Switch Cap with Label
                const labelTex = createKeyCapLabelTexture(label, isTrap);
                const topGeo = new THREE.BoxGeometry(3.0, 0.4, 3.0);
                const topMat = new THREE.MeshPhongMaterial({
                    map: labelTex,
                    color: isTrap ? 0xef4444 : 0xffffff
                });
                const topMesh = new THREE.Mesh(topGeo, topMat);
                topMesh.position.y = 0.75;
                group.add(topMesh);

                group.userData = { isTrap: isTrap, pressed: false, label: label };
                return group;
            }

            // Initial Keycaps Track
            for (let i = 0; i < 22; i++) {
                const laneIdx = Math.floor(Math.random() * 3);
                const isTrap = Math.random() < 0.24 && i > 4;
                const colorHex = ROBLOX_PASTEL_COLORS[i % ROBLOX_PASTEL_COLORS.length];
                const keyMesh = createKeycapMesh(KEY_LABELS[i % KEY_LABELS.length], isTrap, colorHex);

                keyMesh.position.set(LANES[laneIdx], 0, -i * 8.5);
                scene.add(keyMesh);
                keycaps.push(keyMesh);
            }

            // 3D Floating +1 Text & Particle Sparks
            const particles = [];
            const floatingTexts = [];

            function spawnFloatingText(x, y, z, textStr) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#a3e635';
                ctx.font = '900 54px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(textStr, 128, 64);

                const tex = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(3, 1.5, 1);
                sprite.position.set(x, y + 2.5, z);
                scene.add(sprite);

                floatingTexts.push({ sprite: sprite, life: 1.0 });
            }

            function spawnSparks(x, z) {
                for (let i = 0; i < 18; i++) {
                    const pGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0xa3e635 });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.set(x, 1.2, z);
                    scene.add(pMesh);
                    particles.push({
                        mesh: pMesh,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: Math.random() * 0.5 + 0.2,
                        vz: (Math.random() - 0.5) * 0.5,
                        life: 1.0
                    });
                }
            }

            // Game State
            let speedMultiplier = 1;
            let score = 0;
            let isGameOver = false;
            let runningDistance = 0;

            function restartGame() {
                isGameOver = false;
                currentLane = 1;
                targetX = 0;
                playerY = 0;
                playerVy = 0;
                isJumping = false;
                speedMultiplier = 1;
                score = 0;
                runningDistance = 0;

                hudSpeed.textContent = `+${speedMultiplier.toFixed(0)}`;
                hudScore.textContent = '0';
                gameOverModal.style.display = 'none';

                keycaps.forEach((k, idx) => {
                    const laneIdx = Math.floor(Math.random() * 3);
                    k.position.set(LANES[laneIdx], 0, -idx * 8.5);
                    k.userData.pressed = false;
                });
            }

            btnRestart.addEventListener('click', restartGame);

            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                    if (currentLane > 0) {
                        currentLane--;
                        playASMRSwitchSound();
                    }
                } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
                    if (currentLane < 2) {
                        currentLane++;
                        playASMRSwitchSound();
                    }
                } else if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.48;
                        playASMRSwitchSound(800, 0.1);
                    }
                }
            });

            // Touch Swipe Controls
            let touchStartX = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            window.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                const diff = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(diff) > 30) {
                    if (diff > 0 && currentLane < 2) currentLane++;
                    else if (diff < 0 && currentLane > 0) currentLane--;
                } else {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.48;
                    }
                }
            });

            // Main Animation & Render Loop
            let clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const time = clock.getElapsedTime();

                if (!isGameOver) {
                    runningDistance += speedMultiplier * 0.22;
                    score = Math.floor(runningDistance * 10);
                    speedMultiplier += 0.0006;

                    hudSpeed.textContent = `+${Math.floor(speedMultiplier)}`;
                    hudScore.textContent = score.toString();

                    // Flamingo Speed Warp Effect (Dynamic FOV Expansion)
                    const targetFOV = Math.min(85, 60 + (speedMultiplier * 0.35));
                    camera.fov += (targetFOV - camera.fov) * 0.1;
                    camera.updateProjectionMatrix();

                    // Smooth Lane Steering
                    targetX = LANES[currentLane];
                    playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

                    // Jump Gravity
                    if (isJumping) {
                        playerY += playerVy;
                        playerVy -= 0.026;
                        if (playerY <= 0) {
                            playerY = 0;
                            playerVy = 0;
                            isJumping = false;
                            playASMRSwitchSound(200, 0.08);
                        }
                    }
                    playerGroup.position.y = playerY;

                    // Roblox Limb Running Motion
                    armL.rotation.x = Math.sin(time * 16) * 0.8;
                    armR.rotation.x = -Math.sin(time * 16) * 0.8;
                    legL.rotation.x = -Math.sin(time * 16) * 0.8;
                    legR.rotation.x = Math.sin(time * 16) * 0.8;

                    // Rotate Aura Ring
                    auraMesh.rotation.z += 0.05;

                    // Keycaps Scrolling Motion
                    keycaps.forEach(k => {
                        k.position.z += speedMultiplier * 0.26;

                        // Collision Check with Key Switch
                        if (k.position.z > -1.5 && k.position.z < 1.5 && Math.abs(k.position.x - playerGroup.position.x) < 1.8) {
                            if (k.userData.isTrap && playerY < 0.8) {
                                isGameOver = true;
                                playASMRSwitchSound(100, 0.5);
                                document.getElementById('gameover-score-text').textContent = `Final Wins: ${score}`;
                                gameOverModal.style.display = 'flex';
                            } else if (!k.userData.pressed) {
                                k.userData.pressed = true;
                                speedMultiplier += 0.3; // +1 Speed gain
                                playASMRSwitchSound();
                                spawnSparks(k.position.x, k.position.z);
                                spawnFloatingText(k.position.x, playerGroup.position.y, k.position.z, '+1 SPEED!');
                                k.position.y = -0.4;
                            }
                        }

                        // Bounce key back up
                        if (k.position.y < 0) {
                            k.position.y += 0.08;
                        }

                        // Recycle Keycaps behind camera
                        if (k.position.z > 14) {
                            k.position.z = -160;
                            k.position.x = LANES[Math.floor(Math.random() * 3)];
                            k.userData.pressed = false;
                            k.position.y = 0;
                        }
                    });

                    // Update Floating Text
                    for (let i = floatingTexts.length - 1; i >= 0; i--) {
                        const ft = floatingTexts[i];
                        ft.sprite.position.y += 0.08;
                        ft.life -= 0.04;
                        ft.sprite.material.opacity = ft.life;
                        if (ft.life <= 0) {
                            scene.remove(ft.sprite);
                            floatingTexts.splice(i, 1);
                        }
                    }

                    // Update Particle Sparks
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.mesh.position.x += p.vx;
                        p.mesh.position.y += p.vy;
                        p.mesh.position.z += p.vz;
                        p.life -= 0.04;
                        p.mesh.scale.setScalar(p.life);
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            particles.splice(i, 1);
                        }
                    }

                    pointLight.position.x = playerGroup.position.x;
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / (window.innerHeight - 60);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight - 60);
            });

            animate();
        });
    </script>
</body>
</html>
