<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Play Slime Keyboard Escape 3D Online Free - Fullscreen HTML5 Game</title>
    <meta name="description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Dash over mechanical key switches, dodge traps, and set high scores 100% free unblocked.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Play Slime Keyboard Escape 3D Online Free">
    <meta property="og:description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Dash over mechanical key switches, dodge traps, and set high scores.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slimekeyboardescape.vercel.app/play.html">
    <meta property="og:image" content="https://topgames.gg/cache/data/image/game/1-speed-keyboard-escape-obby/1-speed-keyboard-escape-obby-m230x230.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        :root {
            --bg-dark: #070a12;
            --primary: #10b981;
            --primary-glow: #34d399;
            --accent-lime: #a3e635;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --radius-md: 16px;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-main);
        }

        /* Fullscreen Layout Wrapper */
        .player-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000000;
        }

        /* Glassmorphic Top Navigation Header */
        .player-header {
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(16, 185, 129, 0.35);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        .btn-back, .btn-fs {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--primary-glow);
            color: var(--primary-glow);
            transform: translateX(-3px);
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
        }

        .btn-fs:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .player-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .live-indicator {
            width: 9px;
            height: 9px;
            background-color: var(--primary-glow);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary-glow);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        /* Main Game Body Frame */
        .player-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
            background: #070a12;
        }

        .player-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        @media (max-width: 640px) {
            .player-header {
                padding: 0 0.75rem;
            }
            .player-title span:last-child {
                display: none;
            }
            .btn-back span, .btn-fs span {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Top Navigation Header -->
        <header class="player-header">
            <a href="index.html" class="btn-back" id="btn-return-main" title="Return to Slime Keyboard Escape Main Page">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Return to Main Site</span>
            </a>

            <div class="player-title">
                <span class="live-indicator"></span>
                <span>Slime Keyboard Escape 3D</span>
            </div>

            <button type="button" class="btn-fs" id="btn-fullscreen-toggle" title="Toggle Fullscreen Mode">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/></svg>
                <span>Fullscreen</span>
            </button>
        </header>

        <!-- Main Game Player Area -->
        <main class="player-body" id="player-body">
            <iframe 
                id="game-frame" 
                class="player-iframe" 
                src="https://topgames.gg/embed/1-speed-keyboard-escape-obby" 
                allow="autoplay; fullscreen; gamepad; keyboard-map; accelerometer; gyroscope" 
                allowfullscreen>
            </iframe>
        </main>
    </div>

    <!-- Script Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnFs = document.getElementById('btn-fullscreen-toggle');
            const playerBody = document.getElementById('player-body');

            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (playerBody.requestFullscreen) {
                        playerBody.requestFullscreen();
                    } else if (playerBody.webkitRequestFullscreen) {
                        playerBody.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            document.addEventListener('fullscreenchange', () => {
                const isFS = !!document.fullscreenElement;
                btnFs.querySelector('span').textContent = isFS ? 'Exit Fullscreen' : 'Fullscreen';
            });
        });
    </script>
</body>
</html>
