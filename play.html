<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Play Slime Keyboard Escape 3D Online Free - Fullscreen HTML5 Game</title>
    <meta name="description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Run over giant 3D rainbow keyboard keys, dodge traps, and level up speed 100% free unblocked.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Play Slime Keyboard Escape 3D Online Free">
    <meta property="og:description" content="Play the original 3D Slime Keyboard Escape Obby online in your browser! Run over giant 3D rainbow keyboard keys, dodge traps, and level up speed.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://slimekeyboardescape.vercel.app/play.html">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Three.js 3D WebGL Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Styles -->
    <style>
        :root {
            --bg-dark: #090d16;
            --primary: #10b981;
            --primary-glow: #34d399;
            --accent-lime: #a3e635;
            --text-main: #f3f4f6;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-main);
        }

        .player-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: #000000;
        }

        .player-header {
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 1px solid rgba(16, 185, 129, 0.35);
            backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            flex-shrink: 0;
        }

        .btn-back, .btn-fs {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--primary-glow);
            color: var(--primary-glow);
            transform: translateX(-3px);
        }

        .player-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .live-indicator {
            width: 9px;
            height: 9px;
            background-color: var(--primary-glow);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--primary-glow);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.5; }
        }

        .player-body {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
            position: relative;
            background: #090d16;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Overlay */
        .hud-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 100;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(52, 211, 153, 0.5);
            backdrop-filter: blur(12px);
            padding: 0.6rem 1.4rem;
            border-radius: 16px;
            font-family: var(--font-head);
            font-weight: 900;
            font-size: 1.25rem;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .hud-card span.value {
            color: #a3e635;
            text-shadow: 0 0 10px rgba(163, 230, 53, 0.6);
        }

        /* Game Over Modal */
        .gameover-modal {
            position: absolute;
            inset: 0;
            background: rgba(7, 10, 18, 0.88);
            backdrop-filter: blur(14px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .gameover-card {
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #ef4444;
            padding: 2.5rem 3rem;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.4);
            max-width: 440px;
        }

        .gameover-title {
            font-family: var(--font-head);
            font-size: 2.4rem;
            font-weight: 900;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }

        .gameover-score {
            font-size: 1.25rem;
            color: #f3f4f6;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        .btn-restart-game {
            padding: 0.9rem 2.5rem;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--primary-glow), var(--primary));
            color: #090d16;
            font-family: var(--font-head);
            font-size: 1.15rem;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.7);
            transition: all 0.2s ease;
        }

        .btn-restart-game:hover {
            transform: scale(1.06);
            box-shadow: 0 0 45px rgba(16, 185, 129, 0.95);
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Top Navigation Header -->
        <header class="player-header">
            <a href="index.html" class="btn-back" id="btn-return-main">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Return to Main Site</span>
            </a>

            <div class="player-title">
                <span class="live-indicator"></span>
                <span>+1 Speed Roblox Keyboard Escape 3D</span>
            </div>

            <button type="button" class="btn-fs" id="btn-fullscreen-toggle">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span>Fullscreen</span>
            </button>
        </header>

        <!-- Main Game Body Area -->
        <main class="player-body" id="player-body">
            <div class="hud-overlay">
                <div class="hud-card">
                    <span>⚡ MULTIPLIER:</span>
                    <span class="value" id="hud-speed">x1</span>
                </div>
                <div class="hud-card">
                    <span>🏆 WINS:</span>
                    <span class="value" id="hud-score">0</span>
                </div>
            </div>

            <div class="gameover-modal" id="gameover-modal">
                <div class="gameover-card">
                    <div class="gameover-title">FELL OFF KEYBOARD!</div>
                    <div class="gameover-score" id="gameover-score-text">Final Wins: 0</div>
                    <button type="button" class="btn-restart-game" id="btn-restart-3d">RESTART OBBY</button>
                </div>
            </div>

            <canvas id="webgl-canvas"></canvas>
        </main>
    </div>

    <!-- Roblox 1:1 High-Fidelity 3D WebGL Engine Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('player-body');
            const canvas = document.getElementById('webgl-canvas');
            const hudSpeed = document.getElementById('hud-speed');
            const hudScore = document.getElementById('hud-score');
            const gameOverModal = document.getElementById('gameover-modal');
            const btnRestart = document.getElementById('btn-restart-3d');
            const btnFs = document.getElementById('btn-fullscreen-toggle');

            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });

            // Web Audio Synthesizer for ASMR Key Pressing Sounds
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;
            function playSound(freq, duration, type = 'sine') {
                try {
                    if (!audioCtx) audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e){}
            }

            // Three.js Scene Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.006);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
            camera.position.set(0, 8, 15);
            camera.lookAt(0, 2, -12);

            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(15, 30, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xa3e635, 1.5, 35);
            pointLight.position.set(0, 6, 0);
            scene.add(pointLight);

            // Roblox Blocky Character Model
            const playerGroup = new THREE.Group();

            // Head (Yellow Block with Face)
            const headGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const headMat = new THREE.MeshPhongMaterial({ color: 0xfacc15 }); // Yellow Roblox Head
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 2.4;
            headMesh.castShadow = true;
            playerGroup.add(headMesh);

            // Face Eyes & Smile
            const eyeGeo = new THREE.BoxGeometry(0.2, 0.2, 0.05);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
            eyeL.position.set(-0.3, 2.5, -0.61);
            const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
            eyeR.position.set(0.3, 2.5, -0.61);
            playerGroup.add(eyeL);
            playerGroup.add(eyeR);

            // Torso (Blue Shirt)
            const torsoGeo = new THREE.BoxGeometry(1.4, 1.4, 0.8);
            const torsoMat = new THREE.MeshPhongMaterial({ color: 0x0284c7 }); // Blue Torso
            const torsoMesh = new THREE.Mesh(torsoGeo, torsoMat);
            torsoMesh.position.y = 1.1;
            torsoMesh.castShadow = true;
            playerGroup.add(torsoMesh);

            // Left & Right Arms
            const armGeo = new THREE.BoxGeometry(0.5, 1.3, 0.6);
            const armMat = new THREE.MeshPhongMaterial({ color: 0x0284c7 });
            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-1.05, 1.1, 0);
            armL.castShadow = true;
            const armR = new THREE.Mesh(armGeo, armMat);
            armR.position.set(1.05, 1.1, 0);
            armR.castShadow = true;
            playerGroup.add(armL);
            playerGroup.add(armR);

            // Left & Right Legs (Green Pants)
            const legGeo = new THREE.BoxGeometry(0.65, 1.3, 0.65);
            const legMat = new THREE.MeshPhongMaterial({ color: 0x16a34a }); // Green Legs
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.35, -0.2, 0);
            legL.castShadow = true;
            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.35, -0.2, 0);
            legR.castShadow = true;
            playerGroup.add(legL);
            playerGroup.add(legR);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);

            // Lanes: Lane 0 = -4.2, Lane 1 = 0, Lane 2 = 4.2
            const LANES = [-4.2, 0, 4.2];
            let currentLane = 1;
            let targetX = 0;
            let playerY = 0;
            let playerVy = 0;
            let isJumping = false;

            // Roblox Keyboard Track Creation
            const keycaps = [];
            const KEY_LABELS = ['+1', 'SPEED', 'WIN', 'ALT', 'CTRL', 'SHIFT', 'W', 'A', 'S', 'D', 'SPACE', 'ENTER', '99', 'x2'];
            const ROBLOX_COLORS = [0xff2a6d, 0x05d9e8, 0xffb800, 0x01c775, 0x9b51e0, 0xff7000];

            function createKeyCapLabelTexture(text, isTrap) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = isTrap ? '#ef4444' : '#1e293b';
                ctx.fillRect(0, 0, 256, 256);

                ctx.strokeStyle = isTrap ? '#f87171' : '#a3e635';
                ctx.lineWidth = 14;
                ctx.strokeRect(10, 10, 236, 236);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 64px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 128, 128);

                return new THREE.CanvasTexture(canvas);
            }

            function createKeycapMesh(label, isTrap, colorHex) {
                const group = new THREE.Group();

                // Beveled Switch Base
                const keyGeo = new THREE.BoxGeometry(3.6, 1.4, 3.6);
                const keyMat = new THREE.MeshPhongMaterial({
                    color: isTrap ? 0xb91c1c : colorHex,
                    shininess: 90
                });
                const keyMesh = new THREE.Mesh(keyGeo, keyMat);
                keyMesh.castShadow = true;
                keyMesh.receiveShadow = true;
                group.add(keyMesh);

                // Top Switch Cap with Texture Label
                const labelTex = createKeyCapLabelTexture(label, isTrap);
                const topGeo = new THREE.BoxGeometry(3.0, 0.4, 3.0);
                const topMat = new THREE.MeshPhongMaterial({
                    map: labelTex,
                    color: isTrap ? 0xef4444 : 0xffffff
                });
                const topMesh = new THREE.Mesh(topGeo, topMat);
                topMesh.position.y = 0.75;
                group.add(topMesh);

                group.userData = { isTrap: isTrap, pressed: false, label: label };
                return group;
            }

            // Initial Keycaps Track
            for (let i = 0; i < 22; i++) {
                const laneIdx = Math.floor(Math.random() * 3);
                const isTrap = Math.random() < 0.25 && i > 4;
                const colorHex = ROBLOX_COLORS[i % ROBLOX_COLORS.length];
                const keyMesh = createKeycapMesh(KEY_LABELS[i % KEY_LABELS.length], isTrap, colorHex);

                keyMesh.position.set(LANES[laneIdx], 0, -i * 8.5);
                scene.add(keyMesh);
                keycaps.push(keyMesh);
            }

            // 3D Floating Particle Sparks & +1 Floating Text
            const particles = [];

            function spawnSparks(x, z) {
                for (let i = 0; i < 18; i++) {
                    const pGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0xa3e635 });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.set(x, 1.2, z);
                    scene.add(pMesh);
                    particles.push({
                        mesh: pMesh,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: Math.random() * 0.5 + 0.2,
                        vz: (Math.random() - 0.5) * 0.5,
                        life: 1.0
                    });
                }
            }

            // Game State
            let speedMultiplier = 1;
            let score = 0;
            let isGameOver = false;
            let runningDistance = 0;

            function restartGame() {
                isGameOver = false;
                currentLane = 1;
                targetX = 0;
                playerY = 0;
                playerVy = 0;
                isJumping = false;
                speedMultiplier = 1;
                score = 0;
                runningDistance = 0;

                hudSpeed.textContent = `x${speedMultiplier.toFixed(0)}`;
                hudScore.textContent = '0';
                gameOverModal.style.display = 'none';

                keycaps.forEach((k, idx) => {
                    const laneIdx = Math.floor(Math.random() * 3);
                    k.position.set(LANES[laneIdx], 0, -idx * 8.5);
                    k.userData.pressed = false;
                });
            }

            btnRestart.addEventListener('click', restartGame);

            // Keyboard Controls
            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                    if (currentLane > 0) {
                        currentLane--;
                        playSound(320, 0.05);
                    }
                } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
                    if (currentLane < 2) {
                        currentLane++;
                        playSound(320, 0.05);
                    }
                } else if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.48;
                        playSound(480, 0.1);
                    }
                }
            });

            // Touch Swipe Controls
            let touchStartX = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            window.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                const diff = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(diff) > 30) {
                    if (diff > 0 && currentLane < 2) currentLane++;
                    else if (diff < 0 && currentLane > 0) currentLane--;
                } else {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.48;
                    }
                }
            });

            // Main Animation & Render Loop
            let clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const time = clock.getElapsedTime();

                if (!isGameOver) {
                    runningDistance += speedMultiplier * 0.22;
                    score = Math.floor(runningDistance * 10);
                    speedMultiplier += 0.0006;

                    hudSpeed.textContent = `x${Math.floor(speedMultiplier)}`;
                    hudScore.textContent = score.toString();

                    // Smooth Lane Steering
                    targetX = LANES[currentLane];
                    playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

                    // Jump Gravity
                    if (isJumping) {
                        playerY += playerVy;
                        playerVy -= 0.026;
                        if (playerY <= 0) {
                            playerY = 0;
                            playerVy = 0;
                            isJumping = false;
                            playSound(200, 0.08, 'triangle');
                        }
                    }
                    playerGroup.position.y = playerY;

                    // Roblox Character Limb Running Motion
                    armL.rotation.x = Math.sin(time * 16) * 0.8;
                    armR.rotation.x = -Math.sin(time * 16) * 0.8;
                    legL.rotation.x = -Math.sin(time * 16) * 0.8;
                    legR.rotation.x = Math.sin(time * 16) * 0.8;

                    // Keycaps Scrolling Motion
                    keycaps.forEach(k => {
                        k.position.z += speedMultiplier * 0.26;

                        // Collision Check with Key Switch
                        if (k.position.z > -1.5 && k.position.z < 1.5 && Math.abs(k.position.x - playerGroup.position.x) < 1.8) {
                            if (k.userData.isTrap && playerY < 0.8) {
                                isGameOver = true;
                                playSound(100, 0.5, 'sawtooth');
                                document.getElementById('gameover-score-text').textContent = `Final Wins: ${score}`;
                                gameOverModal.style.display = 'flex';
                            } else if (!k.userData.pressed) {
                                k.userData.pressed = true;
                                speedMultiplier += 0.3; // +1 Speed gain
                                playSound(640, 0.1, 'sine');
                                spawnSparks(k.position.x, k.position.z);
                                // Key Press Down bounce
                                k.position.y = -0.4;
                            }
                        }

                        // Bounce key back up
                        if (k.position.y < 0) {
                            k.position.y += 0.08;
                        }

                        // Recycle Keycaps behind camera
                        if (k.position.z > 14) {
                            k.position.z = -160;
                            k.position.x = LANES[Math.floor(Math.random() * 3)];
                            k.userData.pressed = false;
                            k.position.y = 0;
                        }
                    });

                    // Update Particle Sparks
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.mesh.position.x += p.vx;
                        p.mesh.position.y += p.vy;
                        p.mesh.position.z += p.vz;
                        p.life -= 0.04;
                        p.mesh.scale.setScalar(p.life);
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            particles.splice(i, 1);
                        }
                    }

                    // Move Point Light with player
                    pointLight.position.x = playerGroup.position.x;
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / (window.innerHeight - 60);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight - 60);
            });

            animate();
        });
    </script>
</body>
</html>
