    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('player-body');
            const canvas = document.getElementById('webgl-canvas');
            const hudSpeed = document.getElementById('hud-speed');

            const gameOverModal = document.getElementById('gameover-modal');
            const btnRestart = document.getElementById('btn-restart-3d');
            const btnFs = document.getElementById('btn-fullscreen-toggle');
            const switchBtns = document.querySelectorAll('.switch-btn');

            let currentSwitchType = 'blue';

            switchBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    switchBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSwitchType = btn.dataset.type;
                    playASMRSwitchSound();
                });
            });

            btnFs.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (container.requestFullscreen) container.requestFullscreen();
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            });

            btnOpenCode.addEventListener('click', () => codeModal.style.display = 'flex');
            btnClaimCode.addEventListener('click', () => {
                const val = codeInput.value.trim().toUpperCase();
                if (val === 'BYP4SS1') {
                    speedMultiplier += 50;
                    playASMRSwitchSound(880, 0.4);
                    codeModal.style.display = 'none';
                    triggerComboSurgeBanner('🎁 CODE CLAIMED! +15,000 SPEED!');
                } else {
                    alert('Invalid Code! Try BYP4SS1');
                }
            });
            codeModal.addEventListener('click', (e) => { if (e.target === codeModal) codeModal.style.display = 'none'; });

            // Web Audio ASMR Switch Synthesizer
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            let audioCtx = null;

            function playASMRSwitchSound(overrideFreq, duration = 0.08) {
                try {
                    if (!audioCtx) audioCtx = new AudioContext();
                    if (audioCtx.state === 'suspended') audioCtx.resume();

                    let freq = overrideFreq;
                    let type = 'sine';

                    if (!overrideFreq) {
                        if (currentSwitchType === 'blue') {
                            freq = 750;
                            type = 'square';
                        } else if (currentSwitchType === 'red') {
                            freq = 320;
                            type = 'sine';
                        } else {
                            freq = 520;
                            type = 'triangle';
                        }
                    }

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                } catch(e){}
            }

            // Real Keyboard Word Combo Detector
            let typedBuffer = '';
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                const char = e.key.toUpperCase();
                if (/^[A-Z]$/.test(char)) {
                    typedBuffer += char;
                    if (typedBuffer.length > 10) typedBuffer = typedBuffer.slice(-10);

                    if (typedBuffer.includes('SPEED') || typedBuffer.includes('ESCAPE')) {
                        typedBuffer = '';
                        speedMultiplier += 10;
                        triggerComboSurgeBanner('⚡ KEYBOARD COMBO SURGE! +5X SPEED!');
                        playASMRSwitchSound(900, 0.3);
                    }
                }
            });

            function triggerComboSurgeBanner(text) {
                comboBanner.textContent = text;
                comboBanner.classList.add('active');
                setTimeout(() => comboBanner.classList.remove('active'), 2500);
            }

            // Three.js 3D WebGL Engine Setup
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x022c22);
            scene.fog = new THREE.FogExp2(0x022c22, 0.006);

            const camera = new THREE.PerspectiveCamera(65, window.innerWidth / (window.innerHeight - 60), 0.1, 1000);
            camera.position.set(0, 9, 14);
            camera.lookAt(0, 3, -12);

            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight - 60);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
            dirLight.position.set(15, 35, 15);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0x34d399, 1.8, 45);
            pointLight.position.set(0, 6, 0);
            scene.add(pointLight);

            // Screenshot 1:1 Roblox Character Model
            const playerGroup = new THREE.Group();

            // Hair
            const hairGeo = new THREE.BoxGeometry(1.3, 0.4, 1.3);
            const hairMat = new THREE.MeshPhongMaterial({ color: 0x0f172a });

            const torsoMesh = new THREE.Mesh(torsoGeo, torsoMat);
            torsoMesh.position.y = 1.1;

            // Arms

            const armL = new THREE.Mesh(armGeo, armMat);
            armL.position.set(-1.05, 1.1, 0);

            // Legs

            const legMat = new THREE.MeshPhongMaterial({ color: 0x0f172a });
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.35, -0.2, 0);

            const wallMat = new THREE.MeshPhongMaterial({ color: 0x064e3b, shininess: 40 });
            const wallL = new THREE.Mesh(wallGeo, wallMat);

            scene.add(wallR);

            // Safe Zone Archway
            const gateGeo = new THREE.BoxGeometry(26, 8, 2);
            const gateMat = new THREE.MeshPhongMaterial({ color: 0x22c55e, emissive: 0x15803d });
            const gateMesh = new THREE.Mesh(gateGeo, gateMat);
            gateMesh.position.set(0, 12, -180);
            scene.add(gateMesh);

            const MINT_PALETTE = [0x2dd4bf, 0x059669, 0x1e293b, 0x6ee7b7, 0x34d399, 0x047857];
            const KEY_LETTERS = ['M', 'A', 'O', 'Z', 'Q', 'C', 'E', 'K', 'V', 'B', 'X', 'U', 'N', 'P', 'R'];

            const LANES = [-12, -9, -6, -3, 0, 3, 6, 9, 12];
            let currentLane = 4;
            let targetX = 0;
            let playerY = 0;
            let playerVy = 0;
            let isJumping = false;

            const keycaps = [];

            function createMintKeycapTexture(letter, isTrap) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = isTrap ? '#ef4444' : '#1e293b';
                ctx.fillRect(0, 0, 256, 256);

                ctx.strokeStyle = isTrap ? '#f87171' : '#2dd4bf';
                ctx.lineWidth = 14;
                ctx.strokeRect(10, 10, 236, 236);

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 110px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(letter, 128, 128);

                return new THREE.CanvasTexture(canvas);
            }

            function createKeycapMesh(label, isTrap, colorHex) {
                const group = new THREE.Group();

                const keyGeo = new THREE.BoxGeometry(2.7, 1.2, 2.7);
                const keyMat = new THREE.MeshPhongMaterial({
                    color: isTrap ? 0xb91c1c : colorHex,
                    shininess: 80
                });
                const keyMesh = new THREE.Mesh(keyGeo, keyMat);
                keyMesh.castShadow = true;
                keyMesh.receiveShadow = true;
                group.add(keyMesh);

                const labelTex = createMintKeycapTexture(label, isTrap);
                const topGeo = new THREE.BoxGeometry(2.3, 0.35, 2.3);
                const topMat = new THREE.MeshPhongMaterial({
                    map: labelTex,
                    color: isTrap ? 0xef4444 : 0xffffff
                });
                const topMesh = new THREE.Mesh(topGeo, topMat);
                topMesh.position.y = 0.65;
                group.add(topMesh);

                group.userData = { isTrap: isTrap, pressed: false, label: label };
                return group;
            }

            // Safe Spawn Zone: First 8 rows have 0 Traps!
            for (let row = 0; row < 25; row++) {
                for (let col = 0; col < LANES.length; col++) {
                    const isTrap = row > 8 && Math.random() < 0.12; // 0 Traps at start!
                    const colorHex = MINT_PALETTE[(row + col) % MINT_PALETTE.length];
                    const letter = KEY_LETTERS[(row * 9 + col) % KEY_LETTERS.length];
                    const keyMesh = createKeycapMesh(letter, isTrap, colorHex);

                    keyMesh.position.set(LANES[col], 0, -row * 6.5);
                    scene.add(keyMesh);
                    keycaps.push(keyMesh);
                }
            }

            // Floating +1 Shoe Sprites & Sparks
            const particles = [];
            const floatingTexts = [];

            function spawnFloatingShoeSprite(x, y, z) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.font = '900 60px Outfit, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('👟 +1', 128, 64);

                const tex = new THREE.CanvasTexture(canvas);
                const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
                const sprite = new THREE.Sprite(mat);
                sprite.scale.set(3.5, 1.75, 1);
                sprite.position.set(x, y + 2.5, z);
                scene.add(sprite);

                floatingTexts.push({ sprite: sprite, life: 1.0 });
            }

            function spawnSparks(x, z) {
                for (let i = 0; i < 15; i++) {
                    const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                    const pMat = new THREE.MeshBasicMaterial({ color: 0x2dd4bf });
                    const pMesh = new THREE.Mesh(pGeo, pMat);
                    pMesh.position.set(x, 1.2, z);
                    scene.add(pMesh);
                    particles.push({
                        mesh: pMesh,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: Math.random() * 0.4 + 0.2,
                        vz: (Math.random() - 0.5) * 0.4,
                        life: 1.0
                    });
                }
            }

            // Gentle Starting Speed: 1 Speed
            let speedMultiplier = 1;
            let playerLevel = 1;
            let isGameOver = false;
            let runningDistance = 0;

            function restartGame() {
                isGameOver = false;
                currentLane = 4;
                targetX = 0;
                playerY = 0;
                playerVy = 0;
                isJumping = false;
                speedMultiplier = 1;
                playerLevel = 1;
                runningDistance = 0;

                hudSpeed.textContent = `1 Speed`;
                hudLevel.textContent = `Level 1`;
                gameOverModal.style.display = 'none';

                keycaps.forEach(k => k.userData.pressed = false);
            }

            btnRestart.addEventListener('click', restartGame);

            // Controls
            window.addEventListener('keydown', (e) => {
                if (isGameOver) return;
                if (['ArrowLeft', 'KeyA'].includes(e.code)) {
                    if (currentLane > 0) {
                        currentLane--;
                        playASMRSwitchSound();
                    }
                } else if (['ArrowRight', 'KeyD'].includes(e.code)) {
                    if (currentLane < LANES.length - 1) {
                        currentLane++;
                        playASMRSwitchSound();
                    }
                } else if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.48;
                        playASMRSwitchSound(800, 0.1);
                    }
                }
            });

            // Touch Controls
            let touchStartX = 0;
            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });
            window.addEventListener('touchend', (e) => {
                if (isGameOver) return;
                const diff = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(diff) > 25) {
                    if (diff > 0 && currentLane < LANES.length - 1) currentLane++;
                    else if (diff < 0 && currentLane > 0) currentLane--;
                } else {
                    if (!isJumping) {
                        isJumping = true;
                        playerVy = 0.48;
                    }
                }
            });

            // Main Animation & Render Loop
            let clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const time = clock.getElapsedTime();

                if (!isGameOver) {
                    runningDistance += (speedMultiplier + 10) * 0.05;
                    playerLevel = Math.floor(runningDistance / 80) + 1;

                    hudSpeed.textContent = `${Math.floor(speedMultiplier)} Speed`;
                    hudLevel.textContent = `Level ${playerLevel}`;

                    // Dynamic Camera Steering
                    targetX = LANES[currentLane];
                    playerGroup.position.x += (targetX - playerGroup.position.x) * 0.25;

                    // Jump Physics
                    if (isJumping) {
                        playerY += playerVy;
                        playerVy -= 0.026;
                        if (playerY <= 0) {
                            playerY = 0;
                            playerVy = 0;
                            isJumping = false;
                            playASMRSwitchSound(200, 0.08);
                        }
                    }
                    playerGroup.position.y = playerY;

                    // Roblox Limb Running Motion
                    armL.rotation.x = Math.sin(time * 16) * 0.8;
                    armR.rotation.x = -Math.sin(time * 16) * 0.8;
                    legL.rotation.x = -Math.sin(time * 16) * 0.8;
                    legR.rotation.x = Math.sin(time * 16) * 0.8;

                    // Smooth Manageable Scroll Speed
                    const scrollSpeed = (speedMultiplier + 12) * 0.015;

                    keycaps.forEach(k => {
                        k.position.z += scrollSpeed;

                        // Collision Check with Key Switch
                        if (k.position.z > -1.2 && k.position.z < 1.2 && Math.abs(k.position.x - playerGroup.position.x) < 1.4) {
                            if (k.userData.isTrap && playerY < 0.8) {
                                isGameOver = true;
                                playASMRSwitchSound(100, 0.5);
                                document.getElementById('gameover-score-text').textContent = `Final Level: ${playerLevel} (${Math.floor(speedMultiplier)} Speed)`;
                                gameOverModal.style.display = 'flex';
                            } else if (!k.userData.pressed) {
                                k.userData.pressed = true;
                                speedMultiplier += 1; // Gain +1 Speed smoothly
                                playASMRSwitchSound();
                                spawnSparks(k.position.x, k.position.z);
                                spawnFloatingShoeSprite(k.position.x, playerGroup.position.y, k.position.z);
                                k.position.y = -0.3;
                            }
                        }

                        // Bounce key back up
                        if (k.position.y < 0) {
                            k.position.y += 0.06;
                        }

                        // Recycle Keycaps behind camera
                        if (k.position.z > 16) {
                            k.position.z = -146;
                            k.userData.pressed = false;
                            k.position.y = 0;
                        }
                    });

                    // Update Floating Sprites
                    for (let i = floatingTexts.length - 1; i >= 0; i--) {
                        const ft = floatingTexts[i];
                        ft.sprite.position.y += 0.08;
                        ft.life -= 0.04;
                        ft.sprite.material.opacity = ft.life;
                        if (ft.life <= 0) {
                            scene.remove(ft.sprite);
                            floatingTexts.splice(i, 1);
                        }
                    }

                    // Update Particles
                    for (let i = particles.length - 1; i >= 0; i--) {
                        const p = particles[i];
                        p.mesh.position.x += p.vx;
                        p.mesh.position.y += p.vy;
                        p.mesh.position.z += p.vz;
                        p.life -= 0.04;
                        p.mesh.scale.setScalar(p.life);
                        if (p.life <= 0) {
                            scene.remove(p.mesh);
                            particles.splice(i, 1);
                        }
                    }

                    pointLight.position.x = playerGroup.position.x;
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / (window.innerHeight - 60);
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight - 60);
            });

            animate();
        });
    </script>
</body>
</html>
